name: 🐛 Bug Report
description: Report a bug to help us improve Wakaru
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 🐛
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce it?
      placeholder: |
        1. Send ".ytmp3 <url>" to the bot
        2. Wait for the download
        3. See the error
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      description: e.g. Windows 11, Termux, Ubuntu 22.04, macOS
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Output of `bun --version` or `node -v`
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Wakaru version / commit
      description: Output of `git describe --tags` (or the release you're on)
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste any relevant bot output here
      render: shell
    validations:
      required: false
