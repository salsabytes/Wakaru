name: install

on:
  push:
    paths:
      - install.sh
      - .github/workflows/install.yml
      - native/ai/**
      - src/commands/main/ai/**
  workflow_dispatch:

jobs:
  # Real installs on real OS runners (clone path, like `curl | bash`)
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run installer from a temp dir (clone path) + verify
        shell: bash
        run: |
          # install happens in a temp dir, so install + verify must share one shell
          tmp="$(mktemp -d)"
          cp install.sh "$tmp/"
          cd "$tmp"
          bash install.sh
          cd wakaru
          test -d node_modules
          npm run typecheck
          AI_SELFTEST=1 node src/commands/main/ai/index.ts

  # In-place path: run ./install.sh inside the repo
  inplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run installer in place
        shell: bash
        run: ./install.sh
      - name: Verify deps installed
        shell: bash
        run: |
          test -d node_modules
          echo INPLACE_OK

  # Termux has no GitHub runner — simulate the Termux branch with a mocked `pkg`
  termux-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fake the Termux environment
        shell: bash
        run: |
          # /data is mounted noexec on runners — detection dir there, mock pkg in $HOME
          sudo mkdir -p /data/data/com.termux/files/usr
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/pkg" <<'EOF'
          #!/bin/bash
          echo "pkg $* (simulated)" >> "$HOME/pkg.log"
          touch "$HOME/.node-installed"
          exit 0
          EOF
          chmod +x "$HOME/.local/bin/pkg"
          # mocked pkg can't install a real node — shadow `node` so it reads as
          # too-old until pkg "installs" it, then delegates to the real binary
          REAL_NODE="$(command -v node)"
          cat > "$HOME/.local/bin/node" <<EOF
          #!/bin/bash
          if [ "\$1" = "-e" ]; then
            [ -f "\$HOME/.node-installed" ] && exit 0 || exit 1
          fi
          exec "$REAL_NODE" "\$@"
          EOF
          chmod +x "$HOME/.local/bin/node"
          rm -f "$HOME/.node-installed" "$HOME/pkg.log"
      - name: Run installer under simulated Termux
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          cp install.sh "$tmp/"
          cd "$tmp"
          PATH="$HOME/.local/bin:$PATH" bash install.sh
      - name: Verify the Termux branch reached pkg
        shell: bash
        run: |
          test -s "$HOME/pkg.log" && echo TERMUX_SIM_OK || { echo "pkg was never called"; exit 1; }
